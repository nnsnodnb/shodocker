# This workflow is managed by gh actions-lock.

name: Lint

on: [pull_request]

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: actionlint
      uses: reviewdog/action-actionlint@v1.79.1
      with:
        github_token: ${{ secrets.github_token }}
        reporter: github-pr-review
        level: warning

  hadolint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: hadolint
      uses: reviewdog/action-hadolint@v1.55.0
      with:
        github_token: ${{ secrets.github_token }}
        reporter: github-pr-review
        level: warning
