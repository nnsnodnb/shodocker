name: Build

on:
  pull_request:
    paths:
      - .github/workflows/docker-scan.yml
      - Dockerfile
      - pyproject.toml
      - uv.lock

jobs:
  build-scan:
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        platforms: linux/arm64
        load: true
        push: false
        provenance: false
        sbom: false
        tags: nnsnodnb/shodo:pr
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Login to Docker Hub
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Scout CVE scan
      uses: docker/scout-action@v1.28.0
      with:
        command: cves
        image: local://nnsnodnb/shodo:pr
        only-fixed: true
        exit-code: true
        only-fixed: true
        format: markdown
        output: scout-${{ matrix.runner }}.md
        write-comment: false

    - name: Comment to PR
      if: always() && hashFiles(format('scout-{0}.md', matrix.runner)) != ''
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        header: scout-${{ matrix.platform }}
        path: scout-${{ matrix.runner }}.md
