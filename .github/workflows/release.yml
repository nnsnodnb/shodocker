# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    tags:
    - '*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4.4.0

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to Docker Hub
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    
    - name: Get the tag name
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN}}

    - name: Build and push to Docker Container Registries
      uses: docker/build-push-action@v7.4.0
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          nnsnodnb/shodo:${{ env.TAG_NAME }}
          nnsnodnb/shodo:latest
          ghcr.io/nnsnodnb/shodo:${{ env.TAG_NAME }}
          ghcr.io/nnsnodnb/shodo:latest
